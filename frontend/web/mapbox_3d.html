<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mapbox Standard 3D Map</title>
  
  <!-- Mapbox GL JS 3.0.1 -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; font-family: 'Outfit', sans-serif; }
    #map { width: 100%; height: 100%; }

    /* Custom Rider Marker */
    .rider-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .rider-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.9);
      animation: riderPulse 1.4s infinite ease-in-out;
    }
    .rider-dot.leader {
      width: 18px;
      height: 18px;
      background: #ff9100 !important;
      box-shadow: 0 0 20px rgba(255, 145, 0, 1);
    }
    .rider-label {
      margin-top: 4px;
      background: rgba(11, 15, 25, 0.92);
      color: #00f2fe;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(0, 242, 254, 0.5);
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .rider-label.leader {
      color: #ff9100;
      border-color: rgba(255, 145, 0, 0.6);
    }

    @keyframes riderPulse {
      0% { transform: scale(0.95); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; filter: brightness(1.2); }
      100% { transform: scale(0.95); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoicmFrc2hpdGxhZGRhIiwiYSI6ImNtc3RrN2cweTBsbDEyeHIwZnA5aXY5dHkifQ.0J-JnWi4wBW3T-8Nbtmgjg';

    const defaultNagpur = [79.0882, 21.1458];
    
    // Strict Nagpur District Geographic Bounds (Bhivapur/Umred to Ramtek/Saoner, Katol to Mauda)
    const NAGPUR_DISTRICT_BOUNDS = [
      [78.25, 20.55], // Southwest coordinates (Lng, Lat)
      [79.70, 21.75]  // Northeast coordinates (Lng, Lat)
    ];

    let map;
    let riderMarkers = [];

    // Initialize Mapbox Standard 3D strictly locked to Nagpur District
    map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/standard',
      center: defaultNagpur,
      zoom: 14.8,
      minZoom: 10.0,
      maxZoom: 18.5,
      pitch: 55,
      bearing: 15,
      maxBounds: NAGPUR_DISTRICT_BOUNDS
    });

    map.on('style.load', () => {
      try {
        map.setConfigProperty('basemap', 'lightPreset', 'day');
        map.setConfigProperty('basemap', 'showLanduse', true);
        map.setConfigProperty('basemap', 'showPointOfInterestLabels', true);
        map.setConfigProperty('basemap', 'show3dObjects', true);
      } catch (e) {}

      // Default sample Nagpur route coordinates
      const sampleCoords = [
        [79.0882, 21.1458], // Samvidhan Sq
        [79.0750, 21.1410], // Law College
        [79.0600, 21.1310], // Shankar Nagar
        [79.0670, 21.1290], // Deekshabhoomi
        [79.0520, 21.1280]  // VNIT Gate
      ];

      // Add Glowing Route Polyline
      map.addSource('route-source', {
        type: 'geojson',
        data: {
          type: 'Feature',
          geometry: {
            type: 'LineString',
            coordinates: sampleCoords
          }
        }
      });

      // Layer 1: Radium outer glow (Green)
      map.addLayer({
        id: 'route-glow',
        type: 'line',
        source: 'route-source',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': '#00FF66',
          'line-width': 20,
          'line-opacity': 0.75,
          'line-blur': 7
        }
      });

      // Layer 2: Cyan mid glow
      map.addLayer({
        id: 'route-mid',
        type: 'line',
        source: 'route-source',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': '#00F2FE',
          'line-width': 9,
          'line-opacity': 0.9,
          'line-blur': 2
        }
      });

      // Layer 3: Solid white core
      map.addLayer({
        id: 'route-core',
        type: 'line',
        source: 'route-source',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': '#FFFFFF',
          'line-width': 3.5,
          'line-opacity': 1.0
        }
      });

      // Initial Demo Riders
      addDemoRiders();
    });

    function addDemoRiders() {
      const demoRiders = [
        { name: 'Rajesh Sharma ★', isLeader: true, lng: 79.0750, lat: 21.1410, color: '#ff9100' },
        { name: 'Aniket Deshmukh', isLeader: false, lng: 79.0820, lat: 21.1440, color: '#00f2fe' },
        { name: 'Priya Verma', isLeader: false, lng: 79.0640, lat: 21.1305, color: '#00ff66' },
        { name: 'Saurabh Joshi', isLeader: false, lng: 79.0550, lat: 21.1285, color: '#2979ff' }
      ];

      riderMarkers.forEach(m => m.remove());
      riderMarkers = [];

      demoRiders.forEach(r => {
        const el = document.createElement('div');
        el.className = 'rider-marker';
        
        const dot = document.createElement('div');
        dot.className = 'rider-dot' + (r.isLeader ? ' leader' : '');
        dot.style.backgroundColor = r.color;

        const label = document.createElement('div');
        label.className = 'rider-label' + (r.isLeader ? ' leader' : '');
        label.innerText = r.name;

        el.appendChild(dot);
        el.appendChild(label);

        const marker = new mapboxgl.Marker({ element: el })
          .setLngLat([r.lng, r.lat])
          .addTo(map);

        riderMarkers.push(marker);
      });
    }

    // Listen for messages from Flutter Web
    window.addEventListener('message', (event) => {
      if (!event.data) return;
      try {
        const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        if (msg.type === 'SET_ROUTE' && Array.isArray(msg.coordinates)) {
          if (map && map.getSource('route-source')) {
            map.getSource('route-source').setData({
              type: 'Feature',
              geometry: { type: 'LineString', coordinates: msg.coordinates }
            });
          }
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
